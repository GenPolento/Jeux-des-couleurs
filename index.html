<!DOCTYPE html>
<html lang="fr-CA">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jeu des couleurs</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/script.js" defer></script>
</head>
<body class="color-1">
    <div class="content-top" >
        <span class="lifes-display">Life : 3</span>
        <span class="score-display">Score : 0</span>
        <span class="top-score-display"> Top Score: 0</span>
    </div>

    <div class="content-bottom">

        <img class="personnage" id="endormi" src="images/personnage-dort.png" alt="Personnage qui dort">
        <img class="personnage" id="action"  src="images/personnage-action.png" alt="Personnage en action">
        <img class="personnage" id="celebre"  src="images/personnage-celebre.png" alt="Personnage qui celebre">
        <img class="personnage" id="etourdi"  src="images/personnage-etourdi.png" alt="Personnage etourdi">

    <button class="btn-play color-2">
        <span class="btn-icon">🚀</span>
        <span class="btn-text">Jouer</span>
    </button>
    </div>
</body>
</html>
